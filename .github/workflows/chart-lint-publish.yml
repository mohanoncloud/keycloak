name: Validate / Publish helm charts

# Lints the charts in helm/ and, when a PR that changes helm/ is merged into develop or a release*
# branch, publishes every chart to oci://ghcr.io/bhs-bs/charts/<chart>.
on:
  pull_request:
    paths:
      - 'helm/**'
  push:
    branches:
      - develop
      - 'release*'
    paths:
      - 'helm/**'
  workflow_dispatch:

jobs:
  helm-lint-publish:
    uses: BHS-BS/shared-workflow/.github/workflows/helm-lint-publish.yml@develop
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./helm

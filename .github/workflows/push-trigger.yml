name: Keycloak Build upon a push

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string
  push:
    # develop and main only, not develop*: that pattern also matched develop-automation and
    # every develop-<ticket> work branch, each publishing its own images to GHCR. The upstream
    # release*, master and 1.* lines are not built or deployed by BHS-BS.
    branches:
      - develop
      - main

concurrency:
  group: keycloak-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-dockers:
    strategy:
      matrix:
        # keycloak-jboss (mosip-jboss-keycloak) is not built: its base image jboss/keycloak:9.0.0 no
        # longer exists on Docker Hub, and the BHS stack runs quay.io/keycloak/keycloak:26.7 instead.
        include:
          - SERVICE_LOCATION: 'keycloak-init'
            SERVICE_NAME: 'keycloak-init'
          - SERVICE_LOCATION: 'keycloak-artemis'
            SERVICE_NAME: 'mosip-artemis-keycloak'
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    permissions:
      contents: read
      packages: write
    uses: BHS-BS/shared-workflow/.github/workflows/docker-build.yml@develop
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
